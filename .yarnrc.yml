nodeLinker: node-modules

enableScripts: true

# The npm audit endpoint regularly takes longer than Yarn's 60-second default
# after the dependency graph is uploaded. Keep the security gate strict while
# allowing the registry enough time to return its result.
httpTimeout: 180000

npmAuditIgnoreAdvisories:
  # GHSA-3gc7-fjrx-p6mg: bigint-buffer has no patched npm release yet.
  # Owner: SDK maintainers. Revisit when @solana/spl-token removes bigint-buffer
  # or bigint-buffer publishes a fixed version.
  # NOTE: package.json also pins bigint-buffer to a `patch:` resolution (to silence a
  # module-load console.warn). That pin holds it at 1.1.5, so a published fix would NOT
  # be picked up by `yarn up` — drop the patch resolution as well when revisiting this.
  - '1103747'
  # GHSA-w3rx-r6r6-pgpr (1239766) and GHSA-5p2g-fcmc-qvqq (1239765).
  # Path: metro@0.84.4 -> image-size@1.2.1.
  # Owner: @gomesalexandre.
  # Scope: Metro's development/build-time asset parser, not SDK or CLI runtime code.
  # Removal condition: remove both entries once an upstream-fixed image-size release is
  # resolved by this path, or Metro no longer depends on the vulnerable <=2.0.2 range.
  - '1239766'
  - '1239765'
  # GHSA-86w9-cpqp-85rv (1240912): node-forge has no patched release.
  # Path: @expo/cli@56.1.16 -> @expo/code-signing-certificates -> node-forge@1.4.0.
  # Owner: SDK maintainers.
  # Revisit when node-forge publishes a fixed release.
  - '1240912'
  # GHSA-c475-qrg2-pj4r (1240853): get-uri accepts only basic-ftp ^5.3.1.
  # Path: link-check/markdown-link-check -> proxy-agent@6.5.0 ->
  # pac-proxy-agent@7.2.0 -> get-uri@6.0.5 -> basic-ftp@5.3.1.
  # Owner: SDK maintainers.
  # Revisit when get-uri accepts basic-ftp >= 6.2.1.
  - '1240853'
  # GHSA-vfj7-8cjw-p6xm (1240992): braces has no patched release (3.0.3 is latest).
  # Path: micromatch@4.0.8 -> braces@3.0.3, via build/dev tooling only
  # (@changesets/*, fast-glob, metro-file-map, markdownlint-cli2).
  # Owner: SDK maintainers.
  # Revisit when braces publishes a fixed release.
  - '1240992'
  # GHSA-68fv-2mgg-jv7q (1241209): source-map-js@1.2.2 was published 2026-09-30.
  # Path: postcss@8.5.22, @tailwindcss/node@4.3.2, and magicast@0.5.2 -> source-map-js@1.2.1.
  # Owner: SDK maintainers.
  # Revisit: bump to >= 1.2.2 via resolutions once it is older than the 14-day release-age gate
  # (after 2026-10-14).
  - '1241209'
  # GHSA-pqg4-j6r4-53mv (1241332, critical): shell-quote quote() injection; fixed in 1.11.0,
  # published 2026-09-29 and still inside the 14-day release-age gate.
  # Path: concurrently@10.0.3 -> shell-quote@1.10.0 (dev script runner only; quote() never sees user input).
  # Owner: SDK maintainers.
  # Revisit: bump the `shell-quote` resolution to 1.11.0 after 2026-10-13, then drop this entry.
  - '1241332'
  # GHSA-6qxp-vccf-f47h (1241339, high): MCP TypeScript SDK OAuth *client* can send credentials
  # to a server-chosen authorization server; fixed in 1.31.0, published 2026-09-28 (inside the gate).
  # Path: @vultisig/mcp -> @modelcontextprotocol/sdk@1.29.0. clients/mcp only uses McpServer +
  # StdioServerTransport, never the OAuth client.
  # Owner: SDK maintainers.
  # Revisit: bump clients/mcp to ~1.31.0 after 2026-10-12, then drop this entry.
  - '1241339'
  # GHSA-gfr2-rv44-r23c (1242672, high): markdown-it quadratic-time rendering; fixed in 14.3.3,
  # published 2026-10-16 and still inside the 14-day release-age gate.
  # Path: markdownlint-cli2@0.22.1 and typedoc@0.28.19 -> markdown-it@14.3.2 (docs/lint tooling only).
  # Owner: SDK maintainers.
  # Revisit: bump the `markdown-it` resolution to 14.3.3 after 2026-10-30, then drop this entry.
  - '1242672'
  # GHSA-4qx8-w7c3-pj3p (1242862), GHSA-9j65-hcg3-gc64 (1242863), GHSA-9qmh-m7c6-f92p (1242864),
  # high: toml-node DoS in toml.parse(); fixed in 5.0.1, published 2026-10-12 (inside the gate
  # until 2026-10-26). Path: @coral-xyz/anchor@0.32.1 -> toml@4.3.0 (resolved from ^3.0.0 via
  # the `toml@npm:^3.0.0` resolution). Anchor does not parse untrusted TOML at SDK runtime.
  # Owner: SDK maintainers.
  # Revisit: after 2026-10-26 move the `toml@npm:^3.0.0` resolution to ^5.0.1 (major bump; check
  # anchor still loads), then drop these entries.
  - '1242862'
  - '1242863'
  - '1242864'
  # GHSA-mrhx-c7xc-m3w5 (1243066, high): zod collects an issue for every failing array element
  # with no cap, so an oversized array can exhaust memory; fixed in 4.6.6, published
  # 2026-10-11T16:18Z (inside the gate until 2026-10-25T16:18Z). The fix rejects an oversized
  # array before parsing its elements only when the schema declares .max(), .length() or .size();
  # an array with no upper bound still collects one issue per failing element on 4.6.6.
  # Path: @vultisig/sdk and @vultisig/mcp -> zod@4.4.3 (runtime: the signable-transaction schemas
  # use z.array(...).min(1) with no upper bound); eslint-plugin-react-hooks@7.1.1 and knip@6.16.1
  # -> zod@4.3.6 (lint tooling); expo@56.0.12 -> @expo/cli@56.1.16 -> zod@3.25.76 (no 3.x fix).
  # Owner: SDK maintainers.
  # Revisit: bump zod to ^4.6.6 in packages/sdk and clients/mcp, and give the signable-transaction
  # arrays a .max() bound; the bump alone leaves them unbounded. Keep this entry until @expo/cli
  # and the lint tooling resolve zod >= 4.6.6.
  - '1243066'
  # GHSA-jr5w-w6x2-84p9 (1243069, high): Electron trusts compromised eMudhra intermediate
  # certificates; fixed in 42.11.16, published 2026-10-20 (inside the gate until 2026-11-03).
  # Path: devDependency of packages/sdk and examples/electron -> electron@42.10.0. The SDK ships
  # no Electron runtime; only the example app and electron tests use it.
  # Owner: SDK maintainers.
  # Revisit: after 2026-11-03 bump electron to 42.11.16 in packages/sdk and examples/electron,
  # then drop this entry.
  - '1243069'
  # GHSA-27r3-jxmh-p828 (1243074, high): body-parser DoS via trailing bytes after a compressed
  # request body; fixed in 2.4.0, published 2026-10-22 (inside the gate until 2026-11-05).
  # Path: @vultisig/mcp -> @modelcontextprotocol/sdk@1.32.1 -> express@5.2.1 -> body-parser@2.2.2.
  # clients/mcp serves only StdioServerTransport, so no HTTP body is ever parsed.
  # Owner: SDK maintainers.
  # Revisit: after 2026-11-05 add a `body-parser` resolution to ^2.4.0, then drop this entry.
  - '1243074'
  # GHSA-xjj6-f33q-929c (1243113), GHSA-4w7w-5xrc-9h26 (1243473), GHSA-2m5v-pch6-74hx (1243475),
  # GHSA-qrxm-fqhp-jwvm (1243478), high: undici DoS on excessive content-encodings, cache
  # poisoning across cross-origin redirects, TLS options dropped by Agent, and DoS via TLS 1.2
  # renegotiation; all fixed in 7.30.1, published 2026-10-15T14:18Z (inside the gate until
  # 2026-10-29T14:18Z).
  # Path: electron@42.10.0 -> @electron/get@5.0.0, electron-builder's app-builder-lib ->
  # @electron/rebuild -> node-gyp@12.4.0, and markdown-link-check -> markdown-link-extractor ->
  # html-link-extractor -> cheerio@1.2.0, all -> undici@7.29.1 (download/build/docs tooling only).
  # node-gyp declares ^6.25.0, but the root `undici` resolution pins every copy to 7.29.1.
  # Owner: SDK maintainers.
  # Revisit: after 2026-10-29T14:18Z move the root `undici` resolution to 7.30.1, then drop these
  # entries.
  - '1243113'
  - '1243473'
  - '1243475'
  - '1243478'
  # GHSA-mrwp-f3q8-3g9p (1244003, high): follow-redirects drops cross-realm sensitiveHeaders
  # arrays and lets custom credentials follow redirects; fixed in 1.16.2, published
  # 2026-10-25T21:32Z (inside the gate until 2026-11-08T21:32Z).
  # Path: examples/electron (devDependency) -> wait-on@9.0.10 -> axios@1.20.0 ->
  # follow-redirects@1.16.1 (pinned by the root `follow-redirects` resolution). wait-on only
  # polls the local dev server before the example app starts.
  # Owner: SDK maintainers.
  # Revisit: after 2026-11-08T21:32Z move the `follow-redirects` resolution to 1.16.2, then drop
  # this entry.
  - '1244003'
  # GHSA-4528-x5fx-h6hg (1244007, high): joi string().email({ multiple: true }) splits in
  # quadratic time; fixed in 18.3.1, published 2026-10-28T09:59Z (inside the gate until
  # 2026-11-11T09:59Z).
  # Path: examples/electron (devDependency) -> wait-on@9.0.10 -> joi@18.2.6 (pinned by the root
  # `joi@npm:^18.2.1` resolution). wait-on validates its own options, never untrusted input.
  # Owner: SDK maintainers.
  # Revisit: after 2026-11-11T09:59Z move the `joi@npm:^18.2.1` resolution to 18.3.1, then drop
  # this entry.
  - '1244007'
  # GHSA-7wch-p9px-956x (1244017), GHSA-jc66-7q78-782g (1244021), GHSA-8hrf-8g6f-7xwp (1244022),
