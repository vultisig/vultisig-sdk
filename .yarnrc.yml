  # Owner: SDK maintainers.
  # Revisit: after 2026-11-10T04:44Z add a `node-forge` resolution to 1.4.1, then drop these
  # entries. Keep 1240912 above: 1.4.1 does not fix GHSA-86w9-cpqp-85rv.
  - '1244017'
  - '1244021'
  - '1244022'
  - '1244023'
  - '1244024'
yarnPath: .yarn/releases/yarn-4.16.0.cjs
