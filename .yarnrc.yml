nodeLinker: node-modules

enableScripts: true

# The npm audit endpoint regularly takes longer than Yarn's 60-second default
# after the dependency graph is uploaded. Keep the security gate strict while
# allowing the registry enough time to return its result.
httpTimeout: 180000

npmAuditIgnoreAdvisories:
  # GHSA-3gc7-fjrx-p6mg: bigint-buffer has no patched npm release yet.
  # Owner: SDK maintainers. Revisit when @solana/spl-token removes bigint-buffer
  # or bigint-buffer publishes a fixed version.
  # NOTE: package.json also pins bigint-buffer to a `patch:` resolution (to silence a
  # module-load console.warn). That pin holds it at 1.1.5, so a published fix would NOT
  # be picked up by `yarn up` — drop the patch resolution as well when revisiting this.
  - '1103747'
  # GHSA-w3rx-r6r6-pgpr (1138808) and GHSA-5p2g-fcmc-qvqq (1138809).
  # Path: metro@0.84.4 -> image-size@1.2.1.
  # Owner: @gomesalexandre.
  # Scope: Metro's development/build-time asset parser, not SDK or CLI runtime code.
  # Removal condition: remove both entries once an upstream-fixed image-size release is
  # resolved by this path, or Metro no longer depends on the vulnerable <=2.0.2 range.
  - '1138808'
  - '1138809'
yarnPath: .yarn/releases/yarn-4.16.0.cjs
